services:
  redis:
    image: redis/redis-stack:latest   # includes RediSearch â€” plain redis:alpine has NO vector search
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight UI, handy for debugging the cache

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llmcascade
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # after first `docker compose up`, run: docker exec -it <ollama-container> ollama pull phi3:mini

  ml-services:
    build: ./ml-services
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./eval:/app/eval
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30        # up to 2.5 minutes for first-time model loading
      start_period: 10s

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      ml-services:
        condition: service_healthy   # wait until /health returns 200
      ollama:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/llmcascade
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: gateway
      ML_SERVICE_URL: http://ml-services:8000
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379
      FRONTIER_API_KEY: ${FRONTIER_API_KEY}

volumes:
  ollama-data:


