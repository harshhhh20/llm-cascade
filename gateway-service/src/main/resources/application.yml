server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/llmcascade}
    username: ${SPRING_DATASOURCE_USERNAME:gateway}
    password: ${SPRING_DATASOURCE_PASSWORD:gateway}
  jpa:
    hibernate:
      ddl-auto: none   # schema comes from db/init.sql — never let Hibernate own prod schema
    show-sql: false

ml-services:
  url: ${ML_SERVICE_URL:http://localhost:8000}

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}

redis:
  url: ${REDIS_URL:redis://localhost:6379}

frontier:
  api-key: ${FRONTIER_API_KEY:}
  prompt-price-per-million-tokens: 1.25
  completion-price-per-million-tokens: 5.00

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

resilience4j:
  retry:
    instances:
      frontier:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2   # 500ms, 1s, 2s between attempts
        retry-exceptions:
          - com.llmcascade.service.RateLimitedException
          - com.llmcascade.service.FrontierUnavailableException
        ignore-exceptions:
          - com.llmcascade.service.FrontierClientException   # bad request/auth — retrying can't fix this
  circuitbreaker:
    instances:
      frontier:
        sliding-window-size: 20              # evaluate failure rate over the last 20 calls
        minimum-number-of-calls: 10          # don't trip on a tiny sample right after startup
        failure-rate-threshold: 50           # open the circuit if >=50% of recent calls failed
        wait-duration-in-open-state: 30s     # how long to fail fast before trying again
        permitted-number-of-calls-in-half-open-state: 3

